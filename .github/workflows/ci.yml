name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile mlops/api.py
          python -m py_compile mlops/train.py
          python -m py_compile mlops/evaluate.py

      - name: Evaluate model
        run: |
          python mlops/evaluate.py

      - name: Build Docker image
        run: |
          docker build -t ai-bi-mlops-api .
