name: MLOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test-evaluate-monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile mlops/api.py
          python -m py_compile mlops/train.py
          python -m py_compile mlops/evaluate.py
          python -m py_compile monitoring/drift_check.py
          python -m py_compile monitoring/retrain_decision.py

      - name: Evaluate model
        run: |
          python mlops/evaluate.py

      - name: Run drift monitoring
        run: |
          python monitoring/drift_check.py

      - name: Run retraining decision
        run: |
          python monitoring/retrain_decision.py

      - name: Build Docker image
        run: |
          docker build -t ai-bi-forecast-api:latest .


  docker-push:

    needs: test-evaluate-monitor

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-bi-forecast-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-bi-forecast-api:latest

